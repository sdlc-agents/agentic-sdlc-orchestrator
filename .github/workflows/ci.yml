name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint once. It is platform- and version-independent, so running it in every
  # matrix cell would repeat the same answer four times.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check asep tests scripts

  # The generated suite is executed inside these tests, so a green run means the
  # platform produced code that actually works, not merely that it produced code.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q

  # Its own job rather than a conditional step inside the matrix. Gated to one
  # cell it showed as "skipped" three times out of four, which reads like
  # something is wrong; the number itself does not vary by OS or interpreter.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Enforced rather than reported: the CLI sat at 0% until a gate surfaced it.
      - name: Measure and enforce
        run: |
          coverage run --source=asep \
            --omit="asep/providers/blueprints/*,asep/providers/responses/*" \
            -m pytest -q
          coverage report --fail-under=90

      - name: Publish the number to the run summary
        if: always()
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  # A blocking gate, not a report. A security scan nobody fails on is theatre.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-audit

      # No --strict: it treats the local unpublished package as an error.
      - name: Audit dependencies
        run: pip-audit

  scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Every kind of work the platform claims to support, end to end. Each
      # exits non-zero unless its own validation passed.
      - name: Build (greenfield)
        run: python -m asep url_shortener --out runs

      - name: Enhancement
        run: python -m asep analytics_upgrade --out runs

      - name: Bug fix
        run: python -m asep fix_expiry_bug --out runs

      - name: Refactor
        run: python -m asep extract_service_layer --out runs

      - name: Test improvement
        run: python -m asep raise_test_coverage --out runs

      - name: Documentation
        run: python -m asep document_the_service --out runs

      # A well-defined requirement must not stop for a human without cause.
      - name: Well-defined requirement runs unattended
        run: python -m asep fix_expiry_bug --no-assume --out runs

      - name: The legacy sample must be reproducible from the blueprint
        run: |
          python scripts/derive_legacy_sample.py
          git diff --exit-code -- sample_codebase

      # The committed examples are evidence; they must still be producible.
      - name: The committed examples must regenerate
        run: python scripts/generate_examples.py

      # Publish what the six runs actually cost and how often they needed to
      # repair themselves. `if: always()` so a failing scenario still reports
      # its numbers, which is when they are most worth reading.
      - name: Publish run metrics to the summary
        if: always()
        run: python scripts/summarise_runs.py runs/ >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-records
          path: runs/
          retention-days: 7
